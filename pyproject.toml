[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-jobs-system"
version = "1.0.0"
description = "Production-grade async jobs system — senior portfolio"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Pydantic v2
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Celery + Redis
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "kombu>=5.3.0",
    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Security headers
    "secure>=0.3.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.6.0",
    "httpx>=0.27.0",
    # Test infrastructure
    "testcontainers[redis,postgresql]>=4.8.0",
    "freezegun>=1.5.0",
    # Security testing
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
    "bandit[toml]>=1.7.0",
    # Code quality
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "black>=24.8.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
markers = [
    "unit: testes unitários sem I/O real",
    "integration: testes com containers reais",
    "chaos: testes de engenharia de caos",
    "security: testes de vulnerabilidade e pentest",
    "slow: testes que levam mais de 10s",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--cov=app",
    "--cov=workers",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
skips = ["B101", "B601"]
