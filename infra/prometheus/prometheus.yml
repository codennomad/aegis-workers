global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "development"
    service: "async-jobs-system"

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "celery-flower"
    static_configs:
      - targets: ["celery-flower:5555"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    # Note: requires redis_exporter sidecar for full metrics;
    # basic availability is covered by health check
